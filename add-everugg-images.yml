name: Add EverUgg Images
on:
  workflow_dispatch:
jobs:
  add-images:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4
    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests
    - name: 이미지 채워넣기 스크립트 실행
      env:
        SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
        SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
        SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        EVERUGG_USER_ID: ${{ secrets.EVERUGG_USER_ID }}
        EVERUGG_PASSWORD: ${{ secrets.EVERUGG_PASSWORD }}
      run: python add_everugg_images.py
