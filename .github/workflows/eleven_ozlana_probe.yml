name: 11번가 오즈라나 등록 준비 조회 (읽기 전용)

on:
  workflow_dispatch:
    inputs:
      script:
        description: "실행할 파일"
        required: false
        default: "eleven_ozlana_probe.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests openpyxl bcrypt
      - name: Probe
        env:
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          NAVER_PROXY: ${{ secrets.NAVER_PROXY }}
          SYDNEY_CLIENT_ID: ${{ secrets.SYDNEY_CLIENT_ID }}
          SYDNEY_CLIENT_SECRET: ${{ secrets.SYDNEY_CLIENT_SECRET }}
          OZLANA_TOKEN: ${{ secrets.OZLANA_TOKEN }}
          OZLANA_BASE_URL: ${{ secrets.OZLANA_BASE_URL }}
        run: python ${{ github.event.inputs.script || 'eleven_ozlana_probe.py' }}
