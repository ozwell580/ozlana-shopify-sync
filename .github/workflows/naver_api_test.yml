name: (테스트) 시드니셀러 커머스API 연결

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests bcrypt

      - name: Run connection test
        env:
          SYDNEY_CLIENT_ID: ${{ secrets.SYDNEY_CLIENT_ID }}
          SYDNEY_CLIENT_SECRET: ${{ secrets.SYDNEY_CLIENT_SECRET }}
          NAVER_PROXY: ${{ secrets.NAVER_PROXY }}
        run: python naver_api_test.py
