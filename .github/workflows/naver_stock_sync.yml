name: 시드니셀러 재고 자동 연동 (커머스API)

on:
  # 시드니 시간 오전 7시, 저녁 7시 (GitHub는 UTC 기준이라 서머타임/표준시 두 경우를 모두 걸고 아래에서 하나만 실행)
  schedule:
    - cron: "0 20 * * *"   # 서머타임(AEDT, UTC+11) 오전 7시
    - cron: "0 21 * * *"   # 표준시(AEST, UTC+10) 오전 7시
    - cron: "0 8 * * *"    # 서머타임 저녁 7시
    - cron: "0 9 * * *"    # 표준시 저녁 7시
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = 미리보기만 / test-one = 1개만 실제 변경 / apply = 전부 실제 변경"
        required: true
        default: "dry-run"
        type: choice
        options:
          - "dry-run"
          - "test-one"
          - "apply"
      only_codes:
        description: "특정 상품코드만 (쉼표 구분, 비우면 전체)"
        required: false
        default: ""
      include_single:
        description: "옵션 없는 상품(가방·키링·머플러 등) 재고도 연동"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: naver-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check Sydney time (scheduled runs only)
        id: gate
        run: |
          OFFSET=$(TZ=Australia/Sydney date +%z)
          SCHED="${{ github.event.schedule }}"
          RUN=yes
          if [ -n "$SCHED" ]; then
            case "$SCHED" in
              "0 20 * * *"|"0 8 * * *") [ "$OFFSET" = "+1100" ] || RUN=no ;;
              "0 21 * * *"|"0 9 * * *") [ "$OFFSET" = "+1000" ] || RUN=no ;;
            esac
          fi
          echo "시드니 시각: $(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M %Z')  실행: $RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.11"

      - name: Install packages
        if: steps.gate.outputs.run == 'yes'
        run: pip install requests openpyxl bcrypt

      - name: Run stock sync
        if: steps.gate.outputs.run == 'yes'
        env:
          MODE: ${{ github.event_name == 'schedule' && 'apply' || github.event.inputs.mode || 'dry-run' }}
          ONLY_CODES: ${{ github.event.inputs.only_codes }}
          # 예약 실행은 저장소 변수 NAVER_SINGLE_STOCK(on/off)로 켜고 끔. 수동 실행은 체크박스로
          INCLUDE_SINGLE: ${{ github.event_name == 'schedule' && (vars.NAVER_SINGLE_STOCK || 'off') || (github.event.inputs.include_single == 'true' && 'on' || 'off') }}
          SYDNEY_CLIENT_ID: ${{ secrets.SYDNEY_CLIENT_ID }}
          SYDNEY_CLIENT_SECRET: ${{ secrets.SYDNEY_CLIENT_SECRET }}
          NAVER_PROXY: ${{ secrets.NAVER_PROXY }}
          EVERUGG_USER_ID: ${{ secrets.EVERUGG_USER_ID }}
          EVERUGG_PASSWORD: ${{ secrets.EVERUGG_PASSWORD }}
          EVERUGG_BASE_URL: ${{ secrets.EVERUGG_BASE_URL }}
          OZLANA_TOKEN: ${{ secrets.OZLANA_TOKEN }}
          OZLANA_BASE_URL: ${{ secrets.OZLANA_BASE_URL }}
          OZWEAR_API_KEY: ${{ secrets.OZWEAR_API_KEY }}
          OZWEAR_API_SECRET: ${{ secrets.OZWEAR_API_SECRET }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python naver_stock_sync.py

      - name: Upload report
        if: always() && steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: naver_stock_report
          path: naver_stock_report.txt
          if-no-files-found: ignore
          retention-days: 14
