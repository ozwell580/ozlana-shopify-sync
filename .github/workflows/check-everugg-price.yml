name: (일회성) EverUgg 가격 확인
on:
  workflow_dispatch:
    inputs:
      product_code:
        description: "확인할 ProductCode"
        required: true
        default: "AS2055K"

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 필수 라이브러리 설치
        run: pip install requests
      - name: 가격 확인 실행
        env:
          EVERUGG_USER_ID: ${{ secrets.EVERUGG_USER_ID }}
          EVERUGG_PASSWORD: ${{ secrets.EVERUGG_PASSWORD }}
        run: python check_everugg_price.py "${{ github.event.inputs.product_code }}"
