name: 11번가 재고 자동 연동 (Open API)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = 미리보기만 / test-one = 1개만 실제 변경 / apply = 전부 실제 변경"
        required: true
        default: "dry-run"
        type: choice
        options:
          - "dry-run"
          - "test-one"
          - "apply"
      only_codes:
        description: "특정 상품코드만 (쉼표 구분, 비우면 전체)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: eleven-stock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests openpyxl

      - name: Show fixed IP (11번가 상용서버 IP에 등록할 주소)
        env:
          NAVER_PROXY: ${{ secrets.NAVER_PROXY }}
        run: |
          IP=$(curl -s --max-time 20 -x "$NAVER_PROXY" https://api.ipify.org || true)
          echo "고정 IP: ${IP//./ . }"
          for u in https://api.11st.co.kr/rest/prodmarketservice/prodmarket/stck/1 http://api.11st.co.kr/rest/prodmarketservice/prodmarket/stck/1 https://api.commerce.naver.com https://www.google.com; do
            echo "== $u : $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -x "$NAVER_PROXY" "$u" || echo fail)"
            curl -s --max-time 20 -x "$NAVER_PROXY" "$u" 2>&1 | grep -o '<title>[^<]*' | head -1 || true
          done

      - name: Run 11st stock sync
        env:
          MODE: ${{ github.event.inputs.mode || 'dry-run' }}
          ONLY_CODES: ${{ github.event.inputs.only_codes }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          NAVER_PROXY: ${{ secrets.NAVER_PROXY }}
          EVERUGG_USER_ID: ${{ secrets.EVERUGG_USER_ID }}
          EVERUGG_PASSWORD: ${{ secrets.EVERUGG_PASSWORD }}
          EVERUGG_BASE_URL: ${{ secrets.EVERUGG_BASE_URL }}
          OZLANA_TOKEN: ${{ secrets.OZLANA_TOKEN }}
          OZLANA_BASE_URL: ${{ secrets.OZLANA_BASE_URL }}
          OZWEAR_API_KEY: ${{ secrets.OZWEAR_API_KEY }}
          OZWEAR_API_SECRET: ${{ secrets.OZWEAR_API_SECRET }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python eleven_api_stock_sync.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 11st_api_report
          path: 11st_api_report.txt
          if-no-files-found: ignore
          retention-days: 14
