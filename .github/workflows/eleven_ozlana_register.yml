name: 11번가 오즈라나 상품 등록 (Open API)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = 미리보기만 / test-one = 1개만 등록 / apply = 전부 등록"
        required: true
        default: "dry-run"
        type: choice
        options:
          - "dry-run"
          - "test-one"
          - "apply"
      only_codes:
        description: "특정 상품코드만 (쉼표 구분, 비우면 전체)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: eleven-stock-sync
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests openpyxl bcrypt
      - name: Register
        env:
          MODE: ${{ github.event.inputs.mode || 'dry-run' }}
          ONLY_CODES: ${{ github.event.inputs.only_codes }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          NAVER_PROXY: ${{ secrets.NAVER_PROXY }}
          SYDNEY_CLIENT_ID: ${{ secrets.SYDNEY_CLIENT_ID }}
          SYDNEY_CLIENT_SECRET: ${{ secrets.SYDNEY_CLIENT_SECRET }}
          OZLANA_TOKEN: ${{ secrets.OZLANA_TOKEN }}
          OZLANA_BASE_URL: ${{ secrets.OZLANA_BASE_URL }}
        run: python eleven_ozlana_register.py
