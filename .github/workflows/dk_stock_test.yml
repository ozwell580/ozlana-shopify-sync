name: DK UGG Stock API Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests

      - name: Run DK stock test
        run: python dk_stock_test.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dk_stock_result
          path: dk_stock.json
          if-no-files-found: warn
