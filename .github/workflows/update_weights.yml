name: Update Shipping Weights

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = 미리보기만 (변경 안 함) / false = 실제 적용"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  update-weights:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run weight update
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python update_weights.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weight-plan
          path: weight_plan.csv
