name: Ozlana Shopify Sync
on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4
    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests openpyxl
    - name: 동기화 스크립트 실행
      env:
        OZLANA_TOKEN: ${{ secrets.OZLANA_TOKEN }}
        SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
        SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
        SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        EVERUGG_USER_ID: ${{ secrets.EVERUGG_USER_ID }}
        EVERUGG_PASSWORD: ${{ secrets.EVERUGG_PASSWORD }}
      run: python main.py
    - name: CSV 파일 업로드
      uses: actions/upload-artifact@v4
      with:
        name: everugg-unmatched-products
        path: everugg_unmatched_products.csv
    - name: 대량주문 양식 생성
      env:
        SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
        SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
        SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      run: python build_order_form.py --template UGGAUS_order_form_template.xlsx --out-dir dist
    - name: 결과 파일 정리 및 커밋
      run: |
        TODAY=$(date -u +%F)
        mv "dist/UGGAUS_order_form_${TODAY}.xlsx" dist/UGGAUS_order_form_latest.xlsx
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add dist/
        git commit -m "대량주문 양식 자동 갱신" || echo "변경사항 없음"
        git push
