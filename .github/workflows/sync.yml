name: Ozlana Shopify Sync
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4
    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests
    - name: 동기화 스크립트 실행
      env:
        OZLANA_TOKEN: ${{ secrets.OZLANA_TOKEN }}
        SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
        SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        EVERUGG_USER_ID: ${{ secrets.EVERUGG_USER_ID }}
        EVERUGG_PASSWORD: ${{ secrets.EVERUGG_PASSWORD }}
      run: python main.py
    - name: CSV 파일 업로드
      uses: actions/upload-artifact@v4
      with:
        name: everugg-unmatched-products
        path: everugg_unmatched_products.csv
