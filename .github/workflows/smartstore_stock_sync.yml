name: Smartstore Stock File (DK + EverUgg + Ozwear + Ozlana)

on:
  workflow_dispatch:
  schedule:
    # 시드니 시간 오전 9시 전 / 오후 4시 전 (서머타임 AEDT 기준, UTC 표기)
    # 서머타임이 끝나면(4월) 시드니 시간이 1시간씩 늦어져요
    - cron: "45 21 * * *"   # 시드니 08:45
    - cron: "45 4 * * *"    # 시드니 15:45

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVERUGG_USER_ID: ${{ secrets.EVERUGG_USER_ID }}
      EVERUGG_PASSWORD: ${{ secrets.EVERUGG_PASSWORD }}
      EVERUGG_BASE_URL: ${{ secrets.EVERUGG_BASE_URL }}
      OZLANA_TOKEN: ${{ secrets.OZLANA_TOKEN }}
      OZLANA_BASE_URL: ${{ secrets.OZLANA_BASE_URL }}
      OZWEAR_API_KEY: ${{ secrets.OZWEAR_API_KEY }}
      OZWEAR_API_SECRET: ${{ secrets.OZWEAR_API_SECRET }}
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests openpyxl

      - name: Set file time (Sydney)
        run: echo "TS=$(TZ=Australia/Sydney date +%Y%m%d_%H%M)" >> "$GITHUB_ENV"

      # ---------------- 마켓오세아니아 (forms/)
      - name: Build upload file
        env:
          FORMS_DIR: forms
          OUT_PREFIX: smartstore_stock
        run: python smartstore_stock_sync.py

      - name: Upload Market Oceania files
        uses: actions/upload-artifact@v4
        with:
          name: smartstore_stock_${{ env.TS }}
          path: |
            smartstore_stock_upload*.xlsx
            smartstore_stock_report.txt
          retention-days: 14

      # ---------------- 시드니셀러 (forms_sydney/)
      # forms_sydney 폴더에 파일이 있을 때만 실행. DK·에버어그 재고는 위에서 받은 것을 다시 씀 (USE_CACHE)
      - name: Build Sydney Seller upload file
        if: ${{ hashFiles('forms_sydney/*.xlsx') != '' }}
        env:
          FORMS_DIR: forms_sydney
          OUT_PREFIX: sydneyseller_stock
          USE_CACHE: "1"
        run: python smartstore_stock_sync.py

      - name: Upload Sydney Seller files
        if: ${{ hashFiles('forms_sydney/*.xlsx') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sydneyseller_stock_${{ env.TS }}
          path: |
            sydneyseller_stock_upload*.xlsx
            sydneyseller_stock_report.txt
          retention-days: 14
