name: Ozwear Inventory Sync
on:
  workflow_dispatch:
    inputs:
      codes:
        description: '쉼표로 구분된 스타일 코드 목록'
        required: false
      tag:
        description: '추가할 태그 이름'
        required: false
        default: 'EVER-KIDS'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4
    - name: 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: 필수 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install requests
    - name: 태그 작업 실행
      env:
        SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
        SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
        SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      run: python fix_cookie_color_to_beige.py
